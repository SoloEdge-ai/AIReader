name: Windows desktop packages
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Build and verify
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/codex/architecture-refactor'
    runs-on: windows-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      channel: ${{ steps.identity.outputs.channel }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Reader palette and workspace menu UI acceptance
        run: pnpm test:reader-ui
      - name: Set artifact version
        id: identity
        run: node --import tsx scripts/prepare-release.ts
      - run: pnpm desktop:windows
      - name: NSIS file-removal guard regression
        run: ./scripts/uninstall-file-check-smoke.ps1
      - name: Model control UI acceptance
        run: node scripts/model-control-smoke.mjs
      - name: Workspace and Ctrl-wheel acceptance
        run: node --import tsx scripts/workspace-smoke.ts
      - name: Region excerpt card acceptance
        run: node --import tsx scripts/region-smoke.ts
      - name: Cross-page ink and eraser acceptance
        run: node --import tsx scripts/ink-smoke.ts
      - name: Canvas objects and annotation links acceptance
        run: node --import tsx scripts/objects-smoke.ts
      - name: Selected question materials UI acceptance
        run: node --import tsx scripts/materials-smoke.ts
      - name: Chat HTTP and UI acceptance
        run: node --import tsx scripts/chat-smoke.ts
      - name: Screenshot input and panel resize acceptance
        run: node --import tsx scripts/chat-attachments-smoke.ts
      - name: Answer notes and Markdown export acceptance
        run: node --import tsx scripts/answer-notes-smoke.ts
      - name: PDF region questions at Windows display scales
        run: |
          node --import tsx scripts/pdf-region-chat-smoke.ts 1
          node --import tsx scripts/pdf-region-chat-smoke.ts 1.5
          node --import tsx scripts/pdf-region-chat-smoke.ts 2
      - name: Annotation and save-recovery acceptance
        run: node scripts/annotations-smoke.mjs 1 release/win-unpacked/AIReader.exe
        env:
          AIREADER_CI: "1"
      - name: Selection toolbar acceptance
        run: node scripts/selection-smoke.mjs release/win-unpacked/AIReader.exe
        env:
          AIREADER_CI: "1"
      - name: Packaged cross-page ink acceptance
        run: node scripts/ink-packaged-smoke.mjs release/win-unpacked/AIReader.exe
        env:
          AIREADER_CI: "1"
      - name: Packaged canvas objects acceptance
        run: node scripts/objects-packaged-smoke.mjs release/win-unpacked/AIReader.exe
        env:
          AIREADER_CI: "1"
      - name: Packaged desktop smoke test
        shell: pwsh
        run: |
          $portable = Get-ChildItem release/AIReader-Portable-*-x64.exe
          node scripts/desktop-smoke.mjs $portable.FullName
        env:
          AIREADER_CI: "1"
      - name: Desktop close and draft-save acceptance
        run: node scripts/close-save-smoke.mjs
      - name: Installer, update, and uninstall acceptance
        timeout-minutes: 15
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem release/AIReader-Setup-*-x64.exe)
          if ($installer.Count -ne 1) { throw 'Expected one installer' }
          ./scripts/installer-smoke.ps1 -Installer $installer[0].FullName -ExpectedVersion '${{ steps.identity.outputs.version }}'
        env:
          AIREADER_CI: "1"
      - name: UI review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aireader-ui-screenshots-${{ github.sha }}
          path: |
            .local/screenshots/*.png
            test-results/*.png
          retention-days: 30
          if-no-files-found: warn
      - name: Checksums
        shell: pwsh
        run: |
          $portable = @(Get-ChildItem release/AIReader-Portable-*-x64.exe)
          $installer = @(Get-ChildItem release/AIReader-Setup-*-x64.exe)
          if ($portable.Count -ne 1 -or $installer.Count -ne 1) { throw 'Expected portable and installer executables' }
          @($portable[0], $installer[0], (Get-Item release/build-info.json)) | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: aireader-windows11-x64-${{ github.sha }}
          path: |
            release/AIReader-Portable-*-x64.exe
            release/AIReader-Setup-*-x64.exe
            release/SHA256SUMS.txt
            release/build-info.json
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
  release:
    name: Publish release
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/architecture-refactor')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: aireader-windows11-x64-${{ github.sha }}
          path: release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.build.outputs.version }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          set -euo pipefail
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA" || { echo 'Tag belongs to a different commit'; exit 1; }
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          elif [ "$CHANNEL" = preview ]; then
            gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "AIReader $TAG — Preview" --generate-notes --prerelease --latest=false
          else
            gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "AIReader $TAG" --generate-notes --latest
          fi
